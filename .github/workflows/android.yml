name: CostKeeper Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: read

jobs:
  verify-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug for compile check only
        run: gradle --no-daemon :app:assembleDebug
      - name: Compile unsigned release for offline signing
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload unsigned release artifact (no credentials)
        uses: actions/upload-artifact@v4
        with:
          name: CostKeeper-v1.0.1-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  signed-release:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-debug
    runs-on: ubuntu-latest
    env:
      COSTKEEPER_STORE_PASSWORD: ${{ secrets.COSTKEEPER_STORE_PASSWORD }}
      COSTKEEPER_KEY_PASSWORD: ${{ secrets.COSTKEEPER_KEY_PASSWORD }}
      COSTKEEPER_KEY_ALIAS: ${{ secrets.COSTKEEPER_KEY_ALIAS }}
      COSTKEEPER_KEYSTORE_B64: ${{ secrets.COSTKEEPER_KEYSTORE_B64 }}
      COSTKEEPER_KEYSTORE_PATH: ${{ github.workspace }}/release-key.p12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate secrets and restore signing key
        shell: bash
        run: |
          test -n "$COSTKEEPER_STORE_PASSWORD" && test -n "$COSTKEEPER_KEY_PASSWORD" && test -n "$COSTKEEPER_KEY_ALIAS" && test -n "$COSTKEEPER_KEYSTORE_B64" || { echo 'Missing signing secrets'; exit 1; }
          printf '%s' "$COSTKEEPER_KEYSTORE_B64" | base64 -d > "$COSTKEEPER_KEYSTORE_PATH"
          chmod 600 "$COSTKEEPER_KEYSTORE_PATH"
      - name: Compile officially signed APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CostKeeper-v1.0.1-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$COSTKEEPER_KEYSTORE_PATH"
