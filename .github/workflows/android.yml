name: CostKeeper Android

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify package and version
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('app/build.gradle').read_text()
          def value(pattern):
              m=re.search(pattern,s)
              if not m: raise SystemExit('Missing required version/package setting')
              return m.group(1)
          package=value(r"applicationId\s+'([^']+)'")
          code=int(value(r'versionCode\s+(\d+)'))
          version=value(r"versionName\s+'([^']+)'")
          assert package=='tw.costkeeper.restaurant', 'Package ID changed'
          assert code>=3, 'versionCode regression'
          assert re.fullmatch(r'\d+\.\d+\.\d+',version), 'Invalid versionName'
          print('Verified',package,version,code)
          PY
      - name: Compile test APK only
        run: gradle --no-daemon :app:assembleDebug

  signed-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      COSTKEEPER_STORE_PASSWORD: ${{ secrets.COSTKEEPER_STORE_PASSWORD }}
      COSTKEEPER_KEY_PASSWORD: ${{ secrets.COSTKEEPER_KEY_PASSWORD }}
      COSTKEEPER_KEY_ALIAS: ${{ secrets.COSTKEEPER_KEY_ALIAS }}
      COSTKEEPER_KEYSTORE_B64: ${{ secrets.COSTKEEPER_KEYSTORE_B64 }}
      COSTKEEPER_CERT_SHA256: ${{ secrets.COSTKEEPER_CERT_SHA256 }}
      COSTKEEPER_KEYSTORE_PATH: ${{ github.workspace }}/release-key.p12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore release key
        shell: bash
        run: |
          test -n "$COSTKEEPER_STORE_PASSWORD" && test -n "$COSTKEEPER_KEY_PASSWORD" && test -n "$COSTKEEPER_KEY_ALIAS" && test -n "$COSTKEEPER_KEYSTORE_B64" && test -n "$COSTKEEPER_CERT_SHA256" || { echo 'Missing release secrets or expected certificate fingerprint'; exit 1; }
          printf '%s' "$COSTKEEPER_KEYSTORE_B64" | base64 -d > "$COSTKEEPER_KEYSTORE_PATH"
          chmod 600 "$COSTKEEPER_KEYSTORE_PATH"
      - name: Build signed release
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and name release
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-verification.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apk-verification.txt | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ': ')
          EXPECTED=$(printf '%s' "$COSTKEEPER_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ': ')
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED" || { echo 'Signing certificate mismatch'; exit 1; }
          BADGING=$("$AAPT" dump badging "$APK" | grep '^package:')
          echo "$BADGING"
          python3 - "$BADGING" <<'PY'
          import pathlib,re,sys
          badging=sys.argv[1]
          build=pathlib.Path('app/build.gradle').read_text()
          expected_name=re.search(r"versionName\s+'([^']+)'",build).group(1)
          expected_code=re.search(r'versionCode\s+(\d+)',build).group(1)
          assert "name='tw.costkeeper.restaurant'" in badging
          assert "versionCode='"+expected_code+"'" in badging
          assert "versionName='"+expected_name+"'" in badging
          pathlib.Path('/tmp/release-version').write_text(expected_name)
          PY
          VERSION=$(cat /tmp/release-version)
          mkdir -p verified-release
          cp "$APK" "verified-release/CostKeeper-v${VERSION}-release.apk"
          sha256sum "verified-release/CostKeeper-v${VERSION}-release.apk" > "verified-release/SHA256SUMS.txt"
          printf 'Version: %s\nCommit: %s\nCertificate SHA-256: %s\n' "$VERSION" "$GITHUB_SHA" "$ACTUAL" > verified-release/RELEASE_INFO.txt
      - name: Upload verified signed release
        uses: actions/upload-artifact@v4
        with:
          name: CostKeeper-verified-release
          path: verified-release/
          if-no-files-found: error
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$COSTKEEPER_KEYSTORE_PATH"
