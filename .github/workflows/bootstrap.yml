name: CostKeeper Bootstrap and Build
on:
  push:
    paths:
      - 'bootstrap/source.tar.xz'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify uploaded archive
        run: echo 'b79e1e9e258e9cd6b2460063e66997a33d5c87b884d1444e42dd590280d3dbda  bootstrap/source.tar.xz' | sha256sum -c -
      - name: Extract original v1.0.1 source
        run: |
          tar -xJf bootstrap/source.tar.xz
          rm -f bootstrap/source.tar.xz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git restore --staged -- .github/workflows/android.yml
          git diff --cached --quiet || git commit -m 'Import CostKeeper v1.0.1 complete Android source'
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify Android compilation
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CostKeeper-v1.0.1-debug-COMPILE-CHECK-ONLY
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
