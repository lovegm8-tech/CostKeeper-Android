plugins { id 'com.android.application' }

android {
    namespace 'tw.costkeeper.restaurant'
    compileSdk 35
    defaultConfig {
        applicationId 'tw.costkeeper.restaurant'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    def storePath = System.getenv('COSTKEEPER_KEYSTORE_PATH')
    if (storePath && System.getenv('COSTKEEPER_STORE_PASSWORD') &&
            System.getenv('COSTKEEPER_KEY_PASSWORD') && System.getenv('COSTKEEPER_KEY_ALIAS')) {
        signingConfigs {
            release {
                storeFile file(storePath)
                storePassword System.getenv('COSTKEEPER_STORE_PASSWORD')
                keyAlias System.getenv('COSTKEEPER_KEY_ALIAS')
                keyPassword System.getenv('COSTKEEPER_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
        buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    } else {
        buildTypes { release { minifyEnabled false } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}
